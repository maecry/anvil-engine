[package]
name = "pbr-scene"
description = "M3 vertical slice: PBR-material sphere grid, textured cube, ground plane, lights and a fly camera."
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
foundation = { path = "../../crates/foundation", features = ["log-init"] }
platform = { path = "../../crates/platform" }
rhi = { path = "../../crates/rhi" }
rhi-vulkan = { path = "../../crates/rhi-vulkan" }
renderer = { path = "../../crates/renderer" }
tracing.workspace = true
anyhow = "1"
# Only for ANVIL_SCREENSHOT (ADR-0011 §11).
png = "0.18"
