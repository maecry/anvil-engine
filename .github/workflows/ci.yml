name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages (shaderc, software Vulkan, validation layers, spirv-val)
        run: sudo apt-get update && sudo apt-get install -y libshaderc-dev mesa-vulkan-drivers vulkan-validationlayers spirv-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
        env:
          ANVIL_GPU_TESTS: "1"
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Upload golden-image failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: target/golden-failures
          if-no-files-found: ignore
  package:
    # Release archive (ADR-0015 §8): on version tags and by hand; verifies reproducibility first.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: System packages (shaderc)
        run: sudo apt-get update && sudo apt-get install -y libshaderc-dev
      - run: scripts/package.sh --verify
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-release
          path: |
            dist/*.tar.gz
            dist/*.sha256

