name: CI
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages (shaderc, software Vulkan, validation layers, spirv-val)
        run: sudo apt-get update && sudo apt-get install -y libshaderc-dev mesa-vulkan-drivers vulkan-validationlayers spirv-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
        env:
          ANVIL_GPU_TESTS: "1"
      - name: Upload golden-image failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: target/golden-failures
          if-no-files-found: ignore
