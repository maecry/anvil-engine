[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/maecry/anvil-engine"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
tracing = "0.1.44"
thiserror = "2.0.21"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "json"] }
winit = "0.30.13"
raw-window-handle = "0.6.2"
glam = { version = "0.34.2", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
rayon = "1.12.0"

[profile.release]
lto = "thin"

# Benchmarks (ADR-0013 §1) run the release profile; `cargo build --profile bench` is the same.
[profile.bench]
inherits = "release"
