[package]
name = "foundation"
description = "Foundational types shared by Anvil Engine crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
log-init = ["dep:tracing-subscriber"]
# Streams `tracing` spans to the Tracy profiler (ADR-0013 §2); needs a C++ compiler to build.
profile-tracy = ["log-init", "dep:tracing-tracy"]

[dependencies]
tracing.workspace = true
thiserror.workspace = true
glam.workspace = true
rayon.workspace = true
tracing-subscriber = { workspace = true, optional = true }
tracing-tracy = { version = "0.12.0", optional = true }
