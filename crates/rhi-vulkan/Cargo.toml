[package]
name = "rhi-vulkan"
description = "Vulkan implementation of the Anvil RHI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
foundation = { path = "../foundation" }
rhi = { path = "../rhi" }
tracing.workspace = true
thiserror.workspace = true
raw-window-handle.workspace = true
ash = "0.38.0"
ash-window = "0.13.0"
gpu-allocator = { version = "0.28.0", default-features = false, features = ["vulkan", "std"] }

[dev-dependencies]
foundation = { path = "../foundation", features = ["log-init"] }

[build-dependencies]
# Compiles the GLSL test shaders of tests/ (draw, bindless and BDA tests need real SPIR-V).
shaderc = "0.10.1"
